<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📏 照片尺寸测量工具</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f5;color:#333;line-height:1.6}
.app{max-width:900px;margin:0 auto;padding:16px}
.header{text-align:center;padding:24px 16px 16px}
.header h1{font-size:26px;margin-bottom:6px}
.header p{color:#666;font-size:14px}

.tip{background:#e8f5e9;border-left:4px solid #4caf50;padding:10px 14px;border-radius:0 8px 8px 0;font-size:13px;color:#2e7d32;margin-bottom:12px}

.settings-bar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;background:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.setting-group{display:flex;align-items:center;gap:6px}
.setting-group label{font-size:12px;color:#555;font-weight:500;white-space:nowrap}
.setting-group select,.setting-group input{padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:12px;background:#fff}
.setting-group input{width:80px}

.upload-area{background:#fff;border:2px dashed #ccc;border-radius:12px;padding:40px 24px;text-align:center;cursor:pointer;transition:.3s;margin-bottom:12px}
.upload-area:hover{border-color:#4f46e5;background:#f0f0ff}
.upload-icon{font-size:48px;margin-bottom:10px}
.upload-area h3{font-size:16px;margin-bottom:4px}
.upload-area p{color:#888;font-size:13px}
#fileInput{display:none}

.main-layout{display:none;gap:16px;grid-template-columns:1fr 280px}
.canvas-wrapper{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08);position:relative;line-height:0}
#canvas{display:block;width:100%;cursor:crosshair}

.sidebar{display:flex;flex-direction:column;gap:10px}
.panel{background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.panel h4{font-size:13px;margin-bottom:10px;color:#333}

.step-indicator{display:flex;gap:8px;margin-bottom:10px}
.step{flex:1;padding:8px;border-radius:6px;background:#f0f0f0;text-align:center;font-size:12px;color:#888;transition:.3s}
.step.active{background:#4f46e5;color:#fff;font-weight:600}
.step.done{background:#dcfce7;color:#166534}

.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.result-cell{background:#f8f9fa;padding:12px;border-radius:8px;text-align:center}
.result-cell.highlight{background:#eef2ff;border:2px solid #4f46e5}
.result-cell .label{font-size:11px;color:#888;margin-bottom:2px}
.result-cell .value{font-size:18px;font-weight:700;color:#1a1a2e}
.result-cell .value .unit{font-size:12px;color:#888;font-weight:400}
.result-cell.highlight .value{color:#4f46e5}

.measure-list{margin-top:10px}
.m-item{display:flex;align-items:center;gap:8px;padding:8px;background:#f8f9fa;border-radius:6px;margin-bottom:6px;border-left:3px solid #4f46e5}
.m-item .color{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.m-item .name{flex:1;font-size:13px}
.m-item .name input{border:none;background:transparent;font-size:13px;width:100%}
.m-item .name input:focus{outline:none;background:#fff;border-radius:4px;padding:2px 4px}
.m-item .size{font-weight:700;font-size:13px;min-width:80px;text-align:right}
.m-item .del{color:#dc2626;cursor:pointer;font-size:16px;padding:2px 6px}

.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{padding:8px 14px;border:none;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;transition:.2s}
.btn-primary{background:#4f46e5;color:#fff}
.btn-primary:hover{background:#4338ca}
.btn-secondary{background:#e5e5e5;color:#555}
.btn-secondary:hover{background:#d5d5d5}

.footer{text-align:center;padding:20px;color:#999;font-size:12px}

@media(max-width:800px){
  .main-layout{grid-template-columns:1fr}
  .sidebar{order:-1}
  .settings-bar{flex-direction:column;align-items:stretch}
  .setting-group{justify-content:space-between}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>📏 照片尺寸测量工具</h1>
    <p>两点拉一条直线 · 手动标定 · 精准测量</p>
  </div>

  <div class="tip">
    <strong>💡 使用步骤：</strong>① 上传照片 → ② 选择参照物 → ③ 在参照物上点<strong>两点</strong>拉直线标定 → ④ 在物体上点<strong>两点</strong>拉直线测量
  </div>

  <div class="settings-bar">
    <div class="setting-group">
      <label>年龄段</label>
      <select id="sAge">
        <option value="adult">成年人(18-60)</option>
        <option value="elderly">老年人(60+)</option>
        <option value="teen">青少年(12-17)</option>
        <option value="child">儿童(4-11)</option>
      </select>
    </div>
    <div class="setting-group">
      <label>性别</label>
      <select id="sGender">
        <option value="male">男</option>
        <option value="female" selected>女</option>
      </select>
    </div>
    <div class="setting-group">
      <label>手大小</label>
      <select id="sSize">
        <option value="small">偏小</option>
        <option value="average" selected>平均</option>
        <option value="large">偏大</option>
      </select>
    </div>
    <div class="setting-group">
      <label>精确中指长(cm)</label>
      <input type="number" id="sCustom" placeholder="如7.7" min="1" max="30" step="0.1">
    </div>
  </div>

  <div class="upload-area" id="uploadArea">
    <div class="upload-icon">📷</div>
    <h3>点击上传照片，开始测量</h3>
    <p>请把手和物体放在同一平面，正面拍摄</p>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <div class="main-layout" id="mainLayout">
    <div class="canvas-wrapper" id="canvasWrapper">
      <canvas id="canvas"></canvas>
    </div>

    <div class="sidebar">
      <div class="panel">
        <div class="step-indicator">
          <div class="step active" id="step1">1. 标定</div>
          <div class="step" id="step2">2. 测量</div>
        </div>
        <h4>📊 测量结果</h4>
        <div class="result-grid">
          <div class="result-cell highlight">
            <div class="label">比例尺</div>
            <div class="value" id="rScale">—</div>
          </div>
          <div class="result-cell">
            <div class="label">参照物</div>
            <div class="value" id="rRef" style="font-size:13px">—</div>
          </div>
        </div>
        <div class="measure-list" id="mList"></div>
      </div>

      <div class="panel">
        <h4>🔧 操作</h4>
        <div class="btn-row">
          <button class="btn btn-secondary" id="btnUndo">↩️ 撤销</button>
          <button class="btn btn-secondary" id="btnReset">🗑️ 重置</button>
          <button class="btn btn-secondary" id="btnNew">📷 换图</button>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <p>📏 照片尺寸测量工具 · 手动两点标定 · 精准可靠</p>
  </div>
</div>

<script>
const DB = {
  adult: [
    {name:'男性手掌全长',val:189,unit:'mm'},
    {name:'男性中指',val:83,unit:'mm'},
    {name:'男性食指',val:72,unit:'mm'},
    {name:'男性拇指',val:51,unit:'mm'},
    {name:'女性手掌全长',val:174,unit:'mm'},
    {name:'女性中指',val:77,unit:'mm'},
    {name:'女性食指',val:67,unit:'mm'},
    {name:'女性拇指',val:47,unit:'mm'},
  ],
  elderly: [
    {name:'老年男性手掌全长',val:184,unit:'mm'},
    {name:'老年男性中指',val:80,unit:'mm'},
    {name:'老年男性食指',val:70,unit:'mm'},
    {name:'老年男性拇指',val:49,unit:'mm'},
    {name:'老年女性手掌全长',val:170,unit:'mm'},
    {name:'老年女性中指',val:75,unit:'mm'},
    {name:'老年女性食指',val:65,unit:'mm'},
    {name:'老年女性拇指',val:45,unit:'mm'},
  ],
  teen: [
    {name:'少年男性手掌全长',val:180,unit:'mm'},
    {name:'少年男性中指',val:79,unit:'mm'},
    {name:'少年男性食指',val:69,unit:'mm'},
    {name:'少女手掌全长',val:165,unit:'mm'},
    {name:'少女中指',val:73,unit:'mm'},
    {name:'少女食指',val:64,unit:'mm'},
  ],
  child: [
    {name:'4岁男童手掌',val:120,unit:'mm'},
    {name:'4岁男童中指',val:50,unit:'mm'},
    {name:'4岁女童手掌',val:117,unit:'mm'},
    {name:'4岁女童中指',val:49,unit:'mm'},
    {name:'7岁男童手掌',val:136,unit:'mm'},
    {name:'7岁男童中指',val:58,unit:'mm'},
    {name:'7岁女童手掌',val:133,unit:'mm'},
    {name:'7岁女童中指',val:56,unit:'mm'},
    {name:'10岁男童手掌',val:153,unit:'mm'},
    {name:'10岁男童中指',val:65,unit:'mm'},
    {name:'10岁女童手掌',val:152,unit:'mm'},
    {name:'10岁女童中指',val:63,unit:'mm'},
  ]
};
const sizeMult = {small:0.88,average:1.0,large:1.12};
const colors = ['#4f46e5','#dc2626','#059669','#d97706','#7c3aed','#db2777','#0891b2','#65a30d'];

let img=null,scalePxPerMm=null,step='calibrate',points=[],measurements=[],colorIdx=0;
let canvasScale=1; // 记录 canvas 实际显示缩放比例

const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const canvasWrapper=document.getElementById('canvasWrapper');
const uploadArea=document.getElementById('uploadArea'),fileInput=document.getElementById('fileInput');
const mainLayout=document.getElementById('mainLayout');
const step1=document.getElementById('step1'),step2=document.getElementById('step2');

function getRefMm(){
  const custom=parseFloat(document.getElementById('sCustom').value);
  if(custom&&custom>0)return{val:custom*10,name:`自定义 ${custom}cm`,isCustom:true};
  const age=document.getElementById('sAge').value,gender=document.getElementById('sGender').value,size=document.getElementById('sSize').value;
  const list=DB[age];
  let ref=list.find(r=>r.name.includes(gender==='male'?'男性':'女性')&&r.name.includes('中指'));
  if(!ref)ref=list[0];
  return{val:ref.val*sizeMult[size],name:ref.name,isCustom:false};
}

function fmt(mm){
  if(mm>=1000)return(mm/1000).toFixed(2)+'m';
  if(mm>=100)return(mm/10).toFixed(1)+'cm';
  return mm.toFixed(1)+'mm';
}

uploadArea.addEventListener('click',()=>fileInput.click());
uploadArea.addEventListener('dragover',e=>{e.preventDefault();uploadArea.style.borderColor='#4f46e5'});
uploadArea.addEventListener('dragleave',()=>{uploadArea.style.borderColor='#ccc'});
uploadArea.addEventListener('drop',e=>{e.preventDefault();uploadArea.style.borderColor='#ccc';if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0])});
fileInput.addEventListener('change',e=>{if(e.target.files.length)handleFile(e.target.files[0])});

function handleFile(file){
  if(!file.type.startsWith('image/')){alert('请上传图片');return}
  const reader=new FileReader();
  reader.onload=e=>{
    img=new Image();
    img.onload=()=>{
      // 计算 canvas 尺寸，保持原始比例
      const maxW=Math.min(700,canvasWrapper.clientWidth);
      canvasScale=maxW/img.width;
      canvas.width=img.width*canvasScale;
      canvas.height=img.height*canvasScale;
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      uploadArea.style.display='none';
      mainLayout.style.display='grid';
      resetState();
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function resetState(){
  scalePxPerMm=null;step='calibrate';points=[];measurements=[];colorIdx=0;
  step1.className='step active';step2.className='step';
  document.getElementById('rScale').innerHTML='—';
  document.getElementById('rRef').textContent='—';
  document.getElementById('mList').innerHTML='';
  redraw();
}

function setStep(s){
  step=s;
  if(s==='calibrate'){step1.className='step active';step2.className='step'}
  else{step1.className='step done';step2.className='step active'}
}

// ===== 修复：获取准确的 canvas 内坐标 =====
function getCanvasCoords(e){
  const rect=canvas.getBoundingClientRect();
  // 计算 canvas 实际显示尺寸与内部像素尺寸的比率
  const scaleX=canvas.width/rect.width;
  const scaleY=canvas.height/rect.height;
  return{
    x:(e.clientX-rect.left)*scaleX,
    y:(e.clientY-rect.top)*scaleY
  };
}

canvas.addEventListener('click',e=>{
  const pos=getCanvasCoords(e);
  const x=pos.x,y=pos.y;

  if(step==='calibrate'){
    if(points.length>=2)points=[];
    points.push({x,y});
    redraw();
    if(points.length===2){
      const dist=Math.hypot(points[1].x-points[0].x,points[1].y-points[0].y);
      const ref=getRefMm();
      let refMm=ref.val;
      if(ref.unit==='cm')refMm*=10;
      scalePxPerMm=dist/refMm;
      points=[];
      redraw();
      document.getElementById('rScale').innerHTML=`1mm=${scalePxPerMm.toFixed(2)}px`;
      document.getElementById('rRef').textContent=ref.name+(ref.isCustom?' ✓':' ⚠️平均');
      setTimeout(()=>{if(confirm('比例尺已设定！切换到测量模式？'))setStep('measure')},200);
    }
  }else if(step==='measure'){
    if(!scalePxPerMm)return;
    if(points.length>=2)points=[];
    points.push({x,y});
    redraw();
    if(points.length===2){
      const dist=Math.hypot(points[1].x-points[0].x,points[1].y-points[0].y);
      const realMm=dist/scalePxPerMm;
      const color=colors[colorIdx%colors.length];colorIdx++;
      measurements.push({name:`测量#${measurements.length+1}`,realMm,color,points:[...points]});
      points=[];
      redraw();updateList();
    }
  }
});

function redraw(){
  if(!img)return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img,0,0,canvas.width,canvas.height);

  // 已完成的测量
  measurements.forEach(m=>{
    drawLine(m.points[0],m.points[1],m.color,2);
    m.points.forEach(p=>drawPoint(p,m.color));
    const mx=(m.points[0].x+m.points[1].x)/2,my=(m.points[0].y+m.points[1].y)/2;
    drawLabel(mx,my,fmt(m.realMm),m.color);
  });

  // 当前标定/测量中的点
  if(points.length){
    const color=step==='calibrate'?'#4f46e5':'#dc2626';
    points.forEach(p=>drawPoint(p,color));
    if(points.length===2)drawLine(points[0],points[1],color,step==='calibrate'?3:2);
  }
}

function drawLine(p1,p2,color,w){
  ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);
  ctx.strokeStyle=color;ctx.lineWidth=w;ctx.setLineDash([6,4]);ctx.stroke();ctx.setLineDash([]);
}
function drawPoint(p,color){
  ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
  ctx.beginPath();ctx.arc(p.x,p.y,9,0,Math.PI*2);ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();
}
function drawLabel(x,y,text,color){
  ctx.font='bold 12px sans-serif';
  const m=ctx.measureText(text),pad=5,w=m.width+pad*2,h=20;
  let bx=x-w/2,by=y-h-8;
  if(bx<4)bx=4;if(bx+w>canvas.width-4)bx=canvas.width-w-4;if(by<4)by=y+14;
  ctx.fillStyle=color;ctx.globalAlpha=0.9;ctx.fillRect(bx,by,w,h);ctx.globalAlpha=1;
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,x,by+h/2);
}

function updateList(){
  const list=document.getElementById('mList');list.innerHTML='';
  measurements.forEach((m,i)=>{
    const div=document.createElement('div');div.className='m-item';
    div.innerHTML=`<div class="color" style="background:${m.color}"></div><div class="name"><input value="${m.name}" onchange="rename(${i},this.value)"></div><div class="size">${fmt(m.realMm)}</div><div class="del" onclick="del(${i})">×</div>`;
    list.appendChild(div);
  });
}
window.rename=(i,v)=>measurements[i].name=v;
window.del=i=>{measurements.splice(i,1);colorIdx=measurements.length;redraw();updateList()};

document.getElementById('btnUndo').addEventListener('click',()=>{
  if(points.length)points.pop();else if(measurements.length){measurements.pop();colorIdx=measurements.length}
  redraw();updateList();
});
document.getElementById('btnReset').addEventListener('click',()=>{if(confirm('重置所有测量？'))resetState()});
document.getElementById('btnNew').addEventListener('click',()=>{
  if(confirm('更换照片？')){uploadArea.style.display='block';mainLayout.style.display='none';img=null;fileInput.value='';}
});

// 窗口大小改变时重新调整 canvas
window.addEventListener('resize',()=>{
  if(img){
    const maxW=Math.min(700,canvasWrapper.clientWidth);
    const newScale=maxW/img.width;
    if(Math.abs(newScale-canvasScale)>0.01){
      // 重新计算所有点的坐标
      const ratio=newScale/canvasScale;
      measurements.forEach(m=>{
        m.points.forEach(p=>{p.x*=ratio;p.y*=ratio;});
      });
      canvasScale=newScale;
      canvas.width=img.width*canvasScale;
      canvas.height=img.height*canvasScale;
      redraw();
    }
  }
});
</script>
</body>
</html>

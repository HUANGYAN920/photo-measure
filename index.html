<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📏 照片尺寸测量工具</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f5;color:#333;line-height:1.6}
.app{max-width:1000px;margin:0 auto;padding:20px}
.header{text-align:center;padding:30px 20px}
.header h1{font-size:28px;margin-bottom:8px}
.header p{color:#666;font-size:15px}

.upload-area{background:#fff;border:2px dashed #ccc;border-radius:12px;padding:50px 30px;text-align:center;cursor:pointer;transition:.3s;margin-bottom:20px}
.upload-area:hover{border-color:#4f46e5;background:#f0f0ff}
.upload-icon{font-size:48px;margin-bottom:12px}
.upload-area h3{font-size:18px;margin-bottom:6px}
.upload-area p{color:#888;font-size:14px}
#fileInput{display:none}

.editor{display:none;gap:20px;grid-template-columns:1fr 340px}
.canvas-box{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08);position:relative}
#canvas{display:block;width:100%;cursor:crosshair}

.sidebar{display:flex;flex-direction:column;gap:14px}
.panel{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.panel h4{font-size:14px;margin-bottom:12px;color:#333}

.ref-options{display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto}
.ref-option{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f8f9fa;border:2px solid transparent;border-radius:8px;cursor:pointer;font-size:13px;transition:.2s}
.ref-option:hover{border-color:#4f46e5}
.ref-option.selected{border-color:#4f46e5;background:#eef2ff}
.ref-option .icon{font-size:18px}
.ref-option .info{flex:1}
.ref-option .name{font-weight:600;color:#222}
.ref-option .size{color:#888;font-size:12px}

.age-tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.age-tab{padding:6px 12px;border:1px solid #ddd;border-radius:16px;background:#fff;cursor:pointer;font-size:12px;transition:.2s}
.age-tab.active{background:#4f46e5;color:#fff;border-color:#4f46e5}

.mode-btns{display:flex;gap:8px}
.mode-btn{flex:1;padding:10px;border:2px solid #e0e0e0;border-radius:8px;background:#fff;cursor:pointer;font-size:13px;text-align:center;transition:.2s}
.mode-btn.active{background:#4f46e5;color:#fff;border-color:#4f46e5}

.status{background:#eef2ff;padding:12px 14px;border-radius:8px;font-size:13px;color:#4338ca;margin-bottom:10px}
.status.error{background:#fee2e2;color:#991b1b}
.status.success{background:#dcfce7;color:#166534}

.btn{padding:8px 16px;border:none;border-radius:6px;font-size:13px;cursor:pointer;transition:.2s}
.btn-primary{background:#4f46e5;color:#fff}
.btn-primary:hover{background:#4338ca}
.btn-secondary{background:#e5e5e5;color:#555}
.btn-secondary:hover{background:#d5d5d5}
.btn-danger{background:#fee2e2;color:#dc2626}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

.custom-ref{display:flex;gap:6px;align-items:center;margin-top:8px;padding-top:8px;border-top:1px dashed #ddd}
.custom-ref input{width:70px;padding:6px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px}
.custom-ref select{padding:6px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px}

.results{display:none;background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-top:16px}
.results h3{font-size:16px;margin-bottom:12px}
.result-item{display:flex;justify-content:space-between;padding:10px 14px;background:#f8f9fa;border-radius:8px;margin-bottom:8px}
.result-item.highlight{background:#eef2ff;border-left:3px solid #4f46e5}
.result-label{font-size:13px;color:#666}
.result-value{font-size:16px;font-weight:700}

.measurement-list{margin-top:12px}
.m-row{display:flex;align-items:center;gap:8px;padding:8px;background:#f8f9fa;border-radius:6px;margin-bottom:6px}
.m-row .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.m-row input{flex:1;border:none;background:transparent;font-size:13px;padding:2px 4px}
.m-row input:focus{outline:none;background:#fff;border-radius:4px}
.m-row .val{font-weight:700;font-size:14px;min-width:80px;text-align:right}
.m-row .del{color:#dc2626;cursor:pointer;font-size:16px;padding:2px 6px}

.notice{background:#fffbeb;border-left:4px solid #f59e0b;padding:10px 14px;border-radius:0 8px 8px 0;font-size:12px;color:#92400e;margin-bottom:12px}

@media(max-width:800px){
  .editor{grid-template-columns:1fr}
  .sidebar{order:-1}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>📏 照片尺寸测量工具</h1>
    <p>拍照时把手拍进去 → 选择参照物 → 点击标定 → 测量物体</p>
  </div>

  <div class="notice">
    <strong>⚠️ 使用提示：</strong>拍照时请把手和物体放在同一平面上，尽量正面平拍。参照物尺寸因人而异，使用"自定义精确尺寸"精度最高。
  </div>

  <div class="upload-area" id="uploadArea">
    <div class="upload-icon">📷</div>
    <h3>点击上传照片，或拖拽图片到此处</h3>
    <p>支持 JPG、PNG、WEBP 格式</p>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <div class="editor" id="editor">
    <div class="canvas-box">
      <canvas id="canvas"></canvas>
    </div>

    <div class="sidebar">
      <div class="panel">
        <h4>🎯 自定义精确尺寸（推荐）</h4>
        <div class="custom-ref">
          <label style="font-size:13px">我的中指长度：</label>
          <input type="number" id="customVal" placeholder="8.2" min="1" max="30" step="0.1">
          <select id="customUnit">
            <option value="mm">mm</option>
            <option value="cm" selected>cm</option>
          </select>
          <button class="btn btn-primary" id="btnCustom">使用</button>
        </div>
      </div>

      <div class="panel">
        <h4>🖐️ 或选择年龄段平均值</h4>
        <div class="age-tabs" id="ageTabs">
          <button class="age-tab active" data-age="adult">成年人</button>
          <button class="age-tab" data-age="elderly">老年人</button>
          <button class="age-tab" data-age="teen">青少年</button>
          <button class="age-tab" data-age="child">儿童</button>
        </div>
        <div class="ref-options" id="refOptions"></div>
      </div>

      <div class="panel">
        <h4>🔧 操作模式</h4>
        <div class="mode-btns">
          <button class="mode-btn active" id="btnCalibrate">标定参照物</button>
          <button class="mode-btn" id="btnMeasure">测量物体</button>
        </div>
      </div>

      <div class="status" id="status">请先选择参照物类型，然后在照片上点击两个点标定</div>

      <div class="panel">
        <div class="btn-row">
          <button class="btn btn-secondary" id="btnUndo">↩️ 撤销</button>
          <button class="btn btn-danger" id="btnReset">🗑️ 重置</button>
          <button class="btn btn-secondary" id="btnNew">📷 换照片</button>
        </div>
      </div>
    </div>
  </div>

  <div class="results" id="results">
    <h3>📊 测量结果</h3>
    <div id="scaleResult"></div>
    <div class="measurement-list" id="mList"></div>
  </div>
</div>

<script>
// ===== 数据库 =====
const DB = {
  adult: [
    {icon:'🖐️',name:'男性手掌全长',val:189,unit:'mm',range:'17.5~20.5cm'},
    {icon:'☝️',name:'男性中指',val:83,unit:'mm',range:'7.6~9.0cm'},
    {icon:'👆',name:'男性食指',val:72,unit:'mm',range:'6.4~7.9cm'},
    {icon:'👍',name:'男性拇指',val:51,unit:'mm',range:'4.4~5.8cm'},
    {icon:'🖐️',name:'女性手掌全长',val:174,unit:'mm',range:'15.9~18.9cm'},
    {icon:'☝️',name:'女性中指',val:77,unit:'mm',range:'6.9~8.4cm'},
    {icon:'👆',name:'女性食指',val:67,unit:'mm',range:'6.0~7.4cm'},
    {icon:'👍',name:'女性拇指',val:47,unit:'mm',range:'4.0~5.3cm'},
  ],
  elderly: [
    {icon:'🖐️',name:'老年男性手掌全长',val:184,unit:'mm',range:'17.0~20.0cm'},
    {icon:'☝️',name:'老年男性中指',val:80,unit:'mm',range:'7.3~8.7cm'},
    {icon:'👆',name:'老年男性食指',val:70,unit:'mm',range:'6.2~7.6cm'},
    {icon:'👍',name:'老年男性拇指',val:49,unit:'mm',range:'4.2~5.6cm'},
    {icon:'🖐️',name:'老年女性手掌全长',val:170,unit:'mm',range:'15.5~18.5cm'},
    {icon:'☝️',name:'老年女性中指',val:75,unit:'mm',range:'6.7~8.2cm'},
    {icon:'👆',name:'老年女性食指',val:65,unit:'mm',range:'5.8~7.2cm'},
    {icon:'👍',name:'老年女性拇指',val:45,unit:'mm',range:'3.8~5.1cm'},
  ],
  teen: [
    {icon:'🖐️',name:'少年男性手掌全长',val:180,unit:'mm',range:'16.5~19.5cm'},
    {icon:'☝️',name:'少年男性中指',val:79,unit:'mm',range:'7.2~8.6cm'},
    {icon:'👆',name:'少年男性食指',val:69,unit:'mm',range:'6.1~7.5cm'},
    {icon:'🖐️',name:'少女手掌全长',val:165,unit:'mm',range:'15.0~18.0cm'},
    {icon:'☝️',name:'少女中指',val:73,unit:'mm',range:'6.5~8.0cm'},
    {icon:'👆',name:'少女食指',val:64,unit:'mm',range:'5.6~7.0cm'},
  ],
  child: [
    {icon:'🖐️',name:'4岁男童手掌',val:120,unit:'mm',range:'10.5~13.5cm'},
    {icon:'☝️',name:'4岁男童中指',val:50,unit:'mm',range:'4.2~5.8cm'},
    {icon:'🖐️',name:'4岁女童手掌',val:117,unit:'mm',range:'10.2~13.2cm'},
    {icon:'☝️',name:'4岁女童中指',val:49,unit:'mm',range:'4.1~5.7cm'},
    {icon:'🖐️',name:'7岁男童手掌',val:136,unit:'mm',range:'12.5~15.0cm'},
    {icon:'☝️',name:'7岁男童中指',val:58,unit:'mm',range:'5.0~6.6cm'},
    {icon:'🖐️',name:'7岁女童手掌',val:133,unit:'mm',range:'12.2~14.7cm'},
    {icon:'☝️',name:'7岁女童中指',val:56,unit:'mm',range:'4.8~6.4cm'},
    {icon:'🖐️',name:'10岁男童手掌',val:153,unit:'mm',range:'14.0~16.5cm'},
    {icon:'☝️',name:'10岁男童中指',val:65,unit:'mm',range:'5.6~7.2cm'},
    {icon:'🖐️',name:'10岁女童手掌',val:152,unit:'mm',range:'13.8~16.3cm'},
    {icon:'☝️',name:'10岁女童中指',val:63,unit:'mm',range:'5.4~7.0cm'},
  ]
};

const colors = ['#4f46e5','#dc2626','#059669','#d97706','#7c3aed','#db2777','#0891b2','#65a30d'];

let img=null, scalePxPerMm=null, mode='calibrate', points=[], measurements=[], colorIdx=0, selectedRef=null;

const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
const uploadArea=document.getElementById('uploadArea'), fileInput=document.getElementById('fileInput');
const editor=document.getElementById('editor'), status=document.getElementById('status');
const btnCalibrate=document.getElementById('btnCalibrate'), btnMeasure=document.getElementById('btnMeasure');

// Upload
uploadArea.addEventListener('click',()=>fileInput.click());
uploadArea.addEventListener('dragover',e=>{e.preventDefault();uploadArea.style.borderColor='#4f46e5'});
uploadArea.addEventListener('dragleave',()=>{uploadArea.style.borderColor='#ccc'});
uploadArea.addEventListener('drop',e=>{e.preventDefault();uploadArea.style.borderColor='#ccc';if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0])});
fileInput.addEventListener('change',e=>{if(e.target.files.length)handleFile(e.target.files[0])});

function handleFile(file){
  if(!file.type.startsWith('image/')){alert('请上传图片');return}
  const reader=new FileReader();
  reader.onload=e=>{
    img=new Image();
    img.onload=()=>{
      resetAll();
      const maxW=Math.min(700,window.innerWidth-60);
      const s=Math.min(1,maxW/img.width);
      canvas.width=img.width*s;canvas.height=img.height*s;
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      uploadArea.style.display='none';editor.style.display='grid';
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

// Render refs
function renderRefs(age){
  const container=document.getElementById('refOptions');
  container.innerHTML='';
  DB[age].forEach(ref=>{
    const div=document.createElement('div');
    div.className='ref-option';
    div.innerHTML=`<span class="icon">${ref.icon}</span><div class="info"><div class="name">${ref.name}</div><div class="size">${ref.val}${ref.unit} · ${ref.range}</div></div>`;
    div.addEventListener('click',()=>{
      container.querySelectorAll('.ref-option').forEach(o=>o.classList.remove('selected'));
      div.classList.add('selected');
      selectedRef={name:ref.name,value:ref.val,unit:ref.unit};
      if(mode==='calibrate')status.textContent=`已选择「${selectedRef.name}」(${selectedRef.val}${selectedRef.unit})，请在照片上点击两个点标定这段长度`;
    });
    container.appendChild(div);
  });
}
renderRefs('adult');

// Age tabs
document.getElementById('ageTabs').querySelectorAll('.age-tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.getElementById('ageTabs').querySelectorAll('.age-tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    renderRefs(tab.dataset.age);
    selectedRef=null;
  });
});

// Custom ref
document.getElementById('btnCustom').addEventListener('click',()=>{
  const val=parseFloat(document.getElementById('customVal').value);
  const unit=document.getElementById('customUnit').value;
  if(!val||val<=0){alert('请输入有效长度');return}
  document.getElementById('refOptions').querySelectorAll('.ref-option').forEach(o=>o.classList.remove('selected'));
  selectedRef={name:'自定义精确尺寸',value:val,unit:unit,isCustom:true};
  status.textContent=`已使用精确尺寸：${val}${unit}，请在照片上点击两个点标定`;
});

// Mode
btnCalibrate.addEventListener('click',()=>setMode('calibrate'));
btnMeasure.addEventListener('click',()=>setMode('measure'));

function setMode(m){
  mode=m;
  btnCalibrate.classList.toggle('active',m==='calibrate');
  btnMeasure.classList.toggle('active',m==='measure');
  points=[];
  redraw();
  if(m==='calibrate'){
    status.className='status';
    status.textContent=selectedRef?`请在照片上点击「${selectedRef.name}」的两个端点`:'请先选择参照物类型';
  }else{
    if(!scalePxPerMm){status.className='status error';status.textContent='⚠️ 请先标定参照物'}
    else{status.className='status success';status.textContent='请在物体上点击两个点测量尺寸'}
  }
}

// Canvas click
canvas.addEventListener('click',e=>{
  const rect=canvas.getBoundingClientRect();
  const x=e.clientX-rect.left, y=e.clientY-rect.top;

  if(mode==='calibrate'){
    if(!selectedRef){status.className='status error';status.textContent='⚠️ 请先选择参照物';return}
    if(points.length>=2)points=[];
    points.push({x,y});
    redraw();
    if(points.length===2){
      const dist=Math.hypot(points[1].x-points[0].x,points[1].y-points[0].y);
      let refMm=selectedRef.value;
      if(selectedRef.unit==='cm')refMm*=10;
      scalePxPerMm=dist/refMm;
      points=[];
      redraw();
      const prec=selectedRef.isCustom?'✓精确值':'⚠️平均值（个体差异±10~15%）';
      status.className='status success';
      status.innerHTML=`✅ 比例尺已设定：1mm=${scalePxPerMm.toFixed(2)}px · ${prec}`;
      updateResults();
      setTimeout(()=>{if(confirm('比例尺已设定！切换到测量模式？'))setMode('measure')},200);
    }else{status.textContent='已标记第1个点，请点击第2个点'}
  }else if(mode==='measure'){
    if(!scalePxPerMm){status.className='status error';status.textContent='⚠️ 请先标定参照物';return}
    if(points.length>=2)points=[];
    points.push({x,y});
    redraw();
    if(points.length===2){
      const dist=Math.hypot(points[1].x-points[0].x,points[1].y-points[0].y);
      const realMm=dist/scalePxPerMm;
      const color=colors[colorIdx%colors.length];colorIdx++;
      measurements.push({name:`测量#${measurements.length+1}`,pixels:dist,realMm,color,points:[...points]});
      points=[];
      updateResults();
      status.className='status success';
      status.textContent=`测量完成：${fmt(realMm)}，可继续测量`;
    }else{status.textContent='已标记第1个点，请点击第2个点'}
  }
});

// Buttons
document.getElementById('btnUndo').addEventListener('click',()=>{
  if(points.length)points.pop();else if(measurements.length){measurements.pop();colorIdx=measurements.length}
  redraw();updateResults();status.textContent='已撤销';
});
document.getElementById('btnReset').addEventListener('click',()=>{if(confirm('确定重置？'))resetAll()});
document.getElementById('btnNew').addEventListener('click',()=>{
  if(confirm('更换照片？当前数据将丢失')){
    uploadArea.style.display='block';editor.style.display='none';document.getElementById('results').style.display='none';
    resetAll();fileInput.value='';
  }
});

function resetAll(){
  scalePxPerMm=null;mode='calibrate';points=[];measurements=[];colorIdx=0;selectedRef=null;
  document.getElementById('refOptions').querySelectorAll('.ref-option').forEach(o=>o.classList.remove('selected'));
  document.getElementById('customVal').value='';
  setMode('calibrate');
  document.getElementById('results').style.display='none';
  if(img)redraw();
}

function redraw(){
  if(!img)return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img,0,0,canvas.width,canvas.height);
  if(mode==='calibrate'&&points.length){
    if(points.length===2)drawLine(points[0],points[1],'#4f46e5',3);
    points.forEach(p=>drawPoint(p,'#4f46e5'));
  }
  measurements.forEach(m=>{
    drawLine(m.points[0],m.points[1],m.color,2);
    m.points.forEach(p=>drawPoint(p,m.color));
    const mx=(m.points[0].x+m.points[1].x)/2,my=(m.points[0].y+m.points[1].y)/2;
    drawLabel(mx,my,fmt(m.realMm),m.color);
  });
  if(mode==='measure'&&points.length)drawPoint(points[0],'#dc2626');
}

function drawLine(p1,p2,color,w){
  ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);
  ctx.strokeStyle=color;ctx.lineWidth=w;ctx.setLineDash([6,4]);ctx.stroke();ctx.setLineDash([]);
}
function drawPoint(p,color){
  ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
  ctx.beginPath();ctx.arc(p.x,p.y,9,0,Math.PI*2);ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();
}
function drawLabel(x,y,text,color){
  ctx.font='bold 12px sans-serif';
  const m=ctx.measureText(text),pad=5,w=m.width+pad*2,h=20;
  let bx=x-w/2,by=y-h-8;
  if(bx<4)bx=4;if(bx+w>canvas.width-4)bx=canvas.width-w-4;if(by<4)by=y+14;
  ctx.fillStyle=color;ctx.globalAlpha=0.9;ctx.fillRect(bx,by,w,h);ctx.globalAlpha=1;
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,x,by+h/2);
}

function fmt(mm){
  if(mm>=1000)return`${(mm/1000).toFixed(2)}m`;
  if(mm>=100)return`${(mm/10).toFixed(1)}cm`;
  return`${mm.toFixed(1)}mm`;
}

function updateResults(){
  const res=document.getElementById('results');
  if(!scalePxPerMm&&measurements.length===0){res.style.display='none';return}
  res.style.display='block';
  const sr=document.getElementById('scaleResult');
  if(scalePxPerMm){
    let h=`<div class="result-item"><span class="result-label">比例尺</span><span class="result-value">1mm=${scalePxPerMm.toFixed(2)}px</span></div>`;
    if(selectedRef)h+=`<div class="result-item"><span class="result-label">参照物</span><span class="result-value" style="font-size:13px">${selectedRef.name}${selectedRef.isCustom?' ✓精确':' ⚠️平均'}</span></div>`;
    sr.innerHTML=h;
  }else sr.innerHTML='';
  const ml=document.getElementById('mList');ml.innerHTML='';
  measurements.forEach((m,i)=>{
    const row=document.createElement('div');row.className='m-row';
    row.innerHTML=`<div class="dot" style="background:${m.color}"></div><input value="${m.name}" onchange="updateName(${i},this.value)"><span class="val">${fmt(m.realMm)}</span><span class="del" onclick="delM(${i})">×</span>`;
    ml.appendChild(row);
  });
}
window.updateName=(i,v)=>measurements[i].name=v;
